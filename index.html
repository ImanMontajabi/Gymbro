<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>جیم برو</title>

    <!-- Theme: applied before first paint so a saved Dracula/Nord/... choice
         never flashes the default palette on load. Must use the same
         localStorage key as src/themes.js (THEME_STORAGE_KEY). An unknown
         value is harmless — the CSS falls back to the :root (Catppuccin)
         palette and hooks/useTheme.js normalizes it after mount. -->
    <script>
      try {
        var gymbroTheme = localStorage.getItem('gymbro_theme')
        if (gymbroTheme) document.documentElement.setAttribute('data-theme', gymbroTheme)
      } catch (e) {}
    </script>

    <!-- PWA: theme color for the browser UI/status bar (Android + desktop
         Chrome, and Mobile Safari's top toolbar since iOS 15). Default
         matches the Catppuccin base color; hooks/useTheme.js overwrites
         this tag's `content` at runtime whenever the theme changes,
         targeting it by id. -->
    <meta name="theme-color" id="theme-color-meta" content="#1e1e2e" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- PWA: iOS home-screen install support — Safari ignores the web
         manifest for these, so they're required here explicitly. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymBro" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
